[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rss-generator"
version = "0.1.0"
description = "Monitors web pages and generates RSS feeds from user-defined CSS selectors"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.19",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "cssselect>=1.2",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-cov>=5.0"]

[project.scripts]
rss-generator = "rss_generator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_generator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
